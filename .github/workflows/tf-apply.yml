name: Terraform Apply

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Path to the Terraform root module"
        required: true
        type: string
      aws_region:
        description: "AWS region"
        required: false
        type: string
        default: "us-east-1"
      role_arn:
        description: "IAM role ARN to assume (enforcer role)"
        required: true
        type: string
      terraform_version:
        description: "Terraform version"
        required: false
        type: string
        default: "latest"
      app_id:
        description: "GitHub App ID for reading private sbe-devops Terraform module repos. Pass via 'with:' using vars.SBE_DEVOPS_APP_ID."
        required: false
        type: string
        default: ""
    secrets:
      app_private_key:
        description: "GitHub App private key for reading private sbe-devops Terraform module repos."
        required: false

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest
    # Hang protection — EKS/RDS creation genuinely runs long. Sized GENEROUSLY on purpose: a timeout that fires mid-apply leaves a partial apply AND a held state lock, which is worse than the hang.
    # Without this a stuck job runs to GitHub's 360-minute default.
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    env:
      APP_ID: ${{ inputs.app_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ inputs.working_directory }}

      - name: Generate token for private modules
        id: module-token
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: sbe-devops

      - name: Configure git credentials for private modules
        if: steps.module-token.conclusion == 'success'
        run: |
          git config --global url."https://oauth2:${{ steps.module-token.outputs.token }}@github.com".insteadOf "https://github.com"

      - name: Terraform Init
        run: terraform init -upgrade
        working-directory: ${{ inputs.working_directory }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ${{ inputs.working_directory }}
