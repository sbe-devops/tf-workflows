name: Terraform Apply

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Path to the Terraform root module"
        required: true
        type: string
      aws_region:
        description: "AWS region"
        required: false
        type: string
        default: "us-east-1"
      role_arn:
        description: "IAM role ARN to assume (enforcer role)"
        required: true
        type: string
      terraform_version:
        description: "Terraform version"
        required: false
        type: string
        default: "latest"
    secrets:
      module_token:
        description: "Short-lived token with read access to private sbe-devops Terraform module repos. Generate via GitHub App in the calling workflow and pass here."
        required: false

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MODULE_TOKEN: ${{ secrets.module_token }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ inputs.working_directory }}

      - name: Configure git credentials for private modules
        if: env.MODULE_TOKEN != ''
        run: |
          git config --global url."https://oauth2:${{ secrets.module_token }}@github.com".insteadOf "https://github.com"

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ inputs.working_directory }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ${{ inputs.working_directory }}
