name: CI

# This repo publishes reusable workflows and, until now, ran no CI of its own: a change to
# `tf-plan.yml` or `tf-apply.yml` was reviewed by eye and released. The destroy guard is
# the first logic here that MUST hold, so it is the first thing gated.
#
# ⚠️ The two test scripts are deliberately dependency-free — bash, awk, sed, diff, perl.
# A guard whose test needs a toolchain is a guard that stops being tested the first time
# the toolchain breaks.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  destroy-guard:
    name: destroy guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Arm 1 — the guard's own bytes, extracted from tf-destroy.yml and run against 35
      # candidate/allow-list pairs, plus the 11 wiring and ordering assertions the bytes
      # cannot see.
      - name: tests/destroy-guard.sh
        run: tests/destroy-guard.sh

      # Arm 2 — does arm 1 actually CATCH a weakened guard? 14 mutations, each required to
      # turn arm 1 red. This is the step that keeps "tests pass" from meaning "tests exist".
      - name: tests/mutate-destroy-guard.sh
        run: tests/mutate-destroy-guard.sh

      - name: Shellcheck the test scripts
        run: shellcheck tests/*.sh
