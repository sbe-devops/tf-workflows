name: Terraform Plan

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Path to the Terraform root module"
        required: true
        type: string
      aws_region:
        description: "AWS region"
        required: false
        type: string
        default: "us-east-1"
      role_arn:
        description: "IAM role ARN to assume (planner role)"
        required: true
        type: string
      terraform_version:
        description: "Terraform version"
        required: false
        type: string
        default: "latest"
      tflint_version:
        description: "TFLint version"
        required: false
        type: string
        default: "latest"
      environment:
        description: "GitHub Environment to run this job in. Declared HERE because `environment:` is not a valid key on a job that is a `uses:` reusable-workflow call. Empty means no environment — and therefore no `environment` claim in the OIDC token."
        required: false
        type: string
        default: ""
      app_id:
        description: "GitHub App ID for reading private sbe-devops Terraform module repos. Pass via 'with:' using vars.SBE_DEVOPS_APP_ID."
        required: false
        type: string
        default: ""
    secrets:
      app_private_key:
        description: "GitHub App private key for reading private sbe-devops Terraform module repos."
        required: false

# Terraform must never wait on stdin in CI. A stack with an undefaulted variable and no
# CI-side value otherwise drops into interactive mode and reads a stdin that will never
# answer — for the FULL job timeout. Fitbooks INFRA lost an evening to exactly this on
# `Plan accounts (mgmt)`: three separate 30-minute hangs, the job's stdout showing the
# variable's own description text mid-prompt.
#
# ⚠️ `-auto-approve` does NOT cover this. It suppresses the apply confirmation only —
# a missing-variable prompt is raised separately, so an apply can hang MID-APPLY, after
# the plan was approved. Strictly worse than hanging at plan.
#
# TF_INPUT at workflow level rather than a flag on each call site: it covers every
# terraform command including ones added later, and cannot be forgotten on a new step.
# `validate` and `fmt` do not accept -input=false at all, so the env var is the only
# thing that covers them.
env:
  TF_INPUT: "0"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    # 🔴 THE ENVIRONMENT IS AN INPUT, NOT A CALLER JOB KEY, and ADR-0046
    # Amendment 4 is why it has to exist at all: the live gate is that every
    # upper-account GitHub-OIDC role carries a `StringEquals` on the
    # `…:environment` claim. A token only carries that claim when its JOB runs in
    # a GitHub Environment — and a caller CANNOT add `environment:` to a `uses:`
    # job, so without this input no caller can satisfy A4.1 at all.
    #
    # ⚠️ EMPTY MEANS NO CLAIM, measured on tf-workflows run 37977151072: an empty
    # environment expression resolves to no environment and the job runs. So
    # against a role that pins the claim, omitting this input fails at
    # `Configure AWS credentials` with AccessDenied — fail-closed, but the error
    # names nothing. The step below echoes what the job actually got.
    environment: ${{ inputs.environment }}
    # Hang protection — plan + tflint + checkov.
    # Without this a stuck job runs to GitHub's 360-minute default.
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      APP_ID: ${{ inputs.app_id }}

    steps:
      - uses: actions/checkout@v4

      # Cheap, and it is the difference between one AccessDenied and four
      # indistinguishable causes (no opt-in · wrong branch · wrong Environment
      # name · Environment absent). Runs BEFORE the credential step so the log
      # shows what the token will carry.
      - name: Report the GitHub Environment this job is running in
        env:
          GH_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ -n "${GH_ENVIRONMENT:-}" ]; then
            echo "GitHub Environment: \"$GH_ENVIRONMENT\" — the OIDC token will carry an environment claim with this value."
          else
            echo "::warning title=No GitHub Environment::This job is running with NO GitHub Environment, so its OIDC token carries no environment claim. If the role being assumed pins the environment claim (ADR-0046 Amendment 4), this run cannot assume it. Pass the environment input."
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ inputs.working_directory }}
        continue-on-error: true

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ inputs.tflint_version }}

      - name: TFLint Init
        run: tflint --init
        working-directory: ${{ inputs.working_directory }}

      - name: TFLint
        id: tflint
        run: tflint --format compact
        working-directory: ${{ inputs.working_directory }}
        continue-on-error: true

      - name: Generate token for private modules
        id: module-token
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: sbe-devops

      - name: Configure git credentials for private modules
        if: steps.module-token.conclusion == 'success'
        run: |
          git config --global url."https://oauth2:${{ steps.module-token.outputs.token }}@github.com".insteadOf "https://github.com"

      # ── Checkov: sees what the stack DEPLOYS, never holds a credential ───────────
      # FB-08: checkov saw the root .tf only (one check on a stack that is one module
      # call). So THIS step fetches the stack's modules, with the token above, through
      # plain git in a step we control, into checkov's own layout. checkov then runs with
      # NO token, NO network and the working directory mounted READ-ONLY (PROOF on #11:
      # the third-party action handed GITHUB_PAT and the tokenised clones to an image
      # behind a mutable tag). Clones keep no .git, so no remote URL survives. A module
      # that can't be fetched is a ::warning (checkov is blind to it), never a failure.
      - name: Fetch modules for checkov
        id: checkov-modules
        working-directory: ${{ inputs.working_directory }}
        continue-on-error: true
        run: |
          set -uo pipefail
          # Each git::https://github.com/<org>/<repo>[//sub]?ref=<ref> source, from the root
          # .tf and (recursively) from fetched modules outside their examples/ and tests/,
          # cloned the way checkov lays modules out: .external_modules/github.com/<org>/<repo>/<ref>
          # (the whole repo; checkov resolves //sub itself). .git is removed from every clone.
          re='source[[:space:]]*=[[:space:]]*"git::https://github\.com/([A-Za-z0-9_.-]+)/([A-Za-z0-9_.-]+)(//[^"?]*)?\?ref=([A-Za-z0-9_.-]+)"'
          tried=" " fetched=0 missed=""
          for _ in 1 2 3 4 5 6; do
            new=0
            while IFS= read -r line; do
              [[ $line =~ $re ]] || continue
              org=${BASH_REMATCH[1]} repo=${BASH_REMATCH[2]%.git} ref=${BASH_REMATCH[4]}
              key="$org/$repo/$ref"
              case "$tried" in *" $key "*) continue ;; esac
              tried="$tried$key " new=1
              d=".external_modules/github.com/$key"
              [ -d "$d" ] && continue   # already laid out (a re-run): never clone over it
              if git clone -q --depth 1 -b "$ref" "https://github.com/$org/$repo.git" "$d" >/dev/null 2>&1; then
                rm -rf "$d/.git"; fetched=$((fetched + 1))
              else
                rm -rf "$d"; missed="$missed github.com/$key"
              fi
            done < <(cat ./*.tf 2>/dev/null; find .external_modules -name '*.tf' -not -path '*/examples/*' -not -path '*/tests/*' -exec cat {} + 2>/dev/null)
            [ "$new" -eq 1 ] || break
          done
          # shellcheck disable=SC2086  # deliberate: one word per missed module
          set -- $missed
          echo "checkov modules: ${fetched} fetched, $# not fetched"
          for m in "$@"; do echo "::warning title=checkov is blind to a module::${m} could not be fetched; checkov will not scan it"; done
          exit 0

      # The image by DIGEST (checkov 3.3.29, the multi-arch index), not the action:
      # a tag can move, a digest can't. --network none: no update check, no upload, no
      # phone-home; nothing in it can leave. REPORT-ONLY, as before: --soft-fail, and
      # continue-on-error so a checkov crash can't turn a consumer red either.
      # tests/checkov-sees-modules.sh pins this step's bytes.
      - name: Checkov Scan
        id: checkov
        working-directory: ${{ inputs.working_directory }}
        continue-on-error: true
        run: |
          docker run --rm --network none -v "$PWD:/tf:ro" -w /tf \
            ghcr.io/bridgecrewio/checkov@sha256:3cc125b5337717b7303dbddd4e79374c120687b5ff6a24f9abdad56b562469f3 \
            -d /tf --framework terraform --download-external-modules true --soft-fail -o cli

      - name: Terraform Init
        run: terraform init -input=false -upgrade
        working-directory: ${{ inputs.working_directory }}

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: ${{ inputs.working_directory }}

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        working-directory: ${{ inputs.working_directory }}
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fmt      = '${{ steps.fmt.outcome }}';
            const tflint   = '${{ steps.tflint.outcome }}';
            const validate = '${{ steps.validate.outcome }}';
            const plan     = '${{ steps.plan.outcome }}';

            const icon = (outcome) => outcome === 'success' ? '✅' : '❌';

            const body = [
              `### Terraform Plan — \`${{ inputs.working_directory }}\``,
              '',
              `| Check | Result |`,
              `|-------|--------|`,
              `| Format   | ${icon(fmt)} \`${fmt}\` |`,
              `| TFLint   | ${icon(tflint)} \`${tflint}\` |`,
              `| Validate | ${icon(validate)} \`${validate}\` |`,
              `| Plan     | ${icon(plan)} \`${plan}\` |`,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
