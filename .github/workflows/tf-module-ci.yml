name: Terraform Module CI

# For TF MODULE repos (tf-aws-*), not consumer repos. A module has no backend
# and no state of its own -- this validates the module code in isolation
# (fmt, init -backend=false, validate, tflint, checkov). Consumer repos that
# actually apply infra use tf-plan.yml / tf-apply.yml instead.

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Path to the Terraform module root"
        required: false
        type: string
        default: "."
      terraform_version:
        description: "Terraform version"
        required: false
        type: string
        default: "latest"
      tflint_version:
        description: "TFLint version"
        required: false
        type: string
        default: "latest"

# Terraform must never wait on stdin in CI. A stack with an undefaulted variable and no
# CI-side value otherwise drops into interactive mode and reads a stdin that will never
# answer — for the FULL job timeout. Fitbooks INFRA lost an evening to exactly this on
# `Plan accounts (mgmt)`: three separate 30-minute hangs, the job's stdout showing the
# variable's own description text mid-prompt.
#
# ⚠️ `-auto-approve` does NOT cover this. It suppresses the apply confirmation only —
# a missing-variable prompt is raised separately, so an apply can hang MID-APPLY, after
# the plan was approved. Strictly worse than hanging at plan.
#
# TF_INPUT at workflow level rather than a flag on each call site: it covers every
# terraform command including ones added later, and cannot be forgotten on a new step.
# `validate` and `fmt` do not accept -input=false at all, so the env var is the only
# thing that covers them.
env:
  TF_INPUT: "0"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    # Hang protection — fmt/validate/tflint/checkov on a single module.
    # Without this a stuck job runs to GitHub's 360-minute default.
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ inputs.working_directory }}
        continue-on-error: true

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ inputs.tflint_version }}

      - name: TFLint Init
        run: tflint --init
        working-directory: ${{ inputs.working_directory }}

      - name: TFLint
        id: tflint
        run: tflint --format compact
        working-directory: ${{ inputs.working_directory }}
        continue-on-error: true

      - name: Checkov Scan
        id: checkov
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: ${{ inputs.working_directory }}
          framework: terraform
          soft_fail: true
          output_format: cli

      - name: Terraform Init
        run: terraform init -input=false -backend=false
        working-directory: ${{ inputs.working_directory }}

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: ${{ inputs.working_directory }}

      # ── `terraform test`, when the module ships tests ────────────────────────
      #
      # 🔴 WHY THIS EXISTS. `tf-aws-ecr` shipped 1,239 lines of trust-policy test
      # — a 491-line native suite, two golden policy documents and a mutation
      # harness that each weaken the module AND regenerate the golden to agree,
      # and `terraform test` catches all three anyway. Verified by running them
      # on 2026-10-08.
      #
      # NONE OF IT RAN. This workflow did fmt, tflint, checkov, init and
      # validate, so the PR went green on lint alone and a later commit could
      # have reverted the trust policy to its wide-open form unnoticed.
      #
      # ⚠️ AND IT HID MORE THAN THE TESTS: a variable `validation` block fires at
      # PLAN time with real values, not at `terraform validate`. So the module's
      # own input guards were unexecuted too. `terraform test` is the only step
      # here that reaches either.
      #
      # Auto-detected rather than opt-in: a `run_tests` input defaulting false
      # leaves every existing consumer unprotected until it reads a changelog,
      # and defaulting true would break the consumers that have no tests. The
      # presence of the files IS the opt-in.
      - name: Detect Terraform tests
        id: has_tests
        run: |
          set -euo pipefail
          # `terraform test` discovers `./*.tftest.hcl` plus its test directory,
          # which defaults to `tests/`. maxdepth 2 covers exactly those.
          count="$(find . -maxdepth 2 -name '*.tftest.hcl' -type f | wc -l | tr -d '[:space:]')"
          if [ "$count" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::found $count terraform test file(s)"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no *.tftest.hcl found — skipping terraform test"
          fi
        working-directory: ${{ inputs.working_directory }}

      # ⚠️ TESTS MUST MOCK THEIR PROVIDERS. This job holds no AWS credentials, by
      # design — CI must be runnable on a PR from anyone. A `run` block that
      # reaches a real provider will fail here, and that failure is correct:
      # it means the test needs `mock_provider`, not that it needs secrets.
      - name: Terraform Test
        id: tftest
        if: steps.has_tests.outputs.found == 'true'
        run: terraform test -no-color
        working-directory: ${{ inputs.working_directory }}
        # Soft here, hard below — matching fmt/validate, so the PR comment still
        # posts with every result before the job fails.
        continue-on-error: true

      - name: Post Results to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fmt      = '${{ steps.fmt.outcome }}';
            const tflint   = '${{ steps.tflint.outcome }}';
            const validate = '${{ steps.validate.outcome }}';
            const tftest   = '${{ steps.tftest.outcome }}';

            const icon = (outcome) => outcome === 'success' ? '✅' : '❌';

            // A skipped test step means the module ships no tests. Rendering
            // that as ❌ would read as a failure, and rendering it as ✅ would
            // read as coverage. It is neither.
            const testRow = tftest === 'skipped'
              ? `| Test     | ⏭️ \`no *.tftest.hcl\` |`
              : `| Test     | ${icon(tftest)} \`${tftest}\` |`;

            const body = [
              `### Terraform Module CI — \`${{ inputs.working_directory }}\``,
              '',
              `| Check | Result |`,
              `|-------|--------|`,
              `| Format   | ${icon(fmt)} \`${fmt}\` |`,
              `| TFLint   | ${icon(tflint)} \`${tflint}\` |`,
              `| Validate | ${icon(validate)} \`${validate}\` |`,
              testRow,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if fmt failed
        if: steps.fmt.outcome == 'failure'
        run: exit 1

      - name: Fail if validate failed
        if: steps.validate.outcome == 'failure'
        run: exit 1

      # 🔴 A TEST THAT CANNOT FAIL THE BUILD IS NOT A GATE. `continue-on-error`
      # above exists only so the PR comment posts first; without this step the
      # whole thing would be decorative, which is the defect it was added to fix.
      #
      # Note `== 'failure'` and not `!= 'success'`: a SKIPPED step must not fail
      # the job, or every module without tests breaks on the first consumer bump.
      - name: Fail if terraform test failed
        if: steps.tftest.outcome == 'failure'
        run: exit 1
