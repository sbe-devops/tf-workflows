name: canary-checkov

# CANARY (branch canary/checkov-v12-3134 only, never merged). Proves on a real runner
# that checkov-action@6f26dc9 (v12.3134.0, checkov 3.3.29) runs, keeps a run with
# FAILING checks green under soft_fail: true, and downloads a stack's modules. The
# private-module path (github_pat = the App token) can't run here: this repo holds no
# App credentials.
on:
  push:
    branches: [canary/checkov-v12-3134]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module-ci:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/tf-module-ci.yml
    with:
      working_directory: canary/module

  # tf-plan's TWO checkov steps, their own bytes extracted from tf-plan.yml (no token
  # here, as for any caller without app_id), on a stack that is one PUBLIC module call.
  stack-arm-fetch-then-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract the two steps from tf-plan.yml
        run: |
          python3 - <<'PY'
          import yaml
          st = [s for j in yaml.safe_load(open(".github/workflows/tf-plan.yml"))["jobs"].values() for s in j["steps"]]
          for i in ("checkov-modules", "checkov"):
              open(f"/tmp/{i}.sh", "w").write(next(s for s in st if s.get("id") == i)["run"])
          PY
      - name: Fetch modules for checkov (tf-plan's bytes)
        working-directory: canary/stack
        run: bash /tmp/checkov-modules.sh
      - name: No .git in the clones
        working-directory: canary/stack
        run: |
          set -euo pipefail
          ls -d .external_modules/github.com/terraform-aws-modules/terraform-aws-s3-bucket/v4.1.2
          [ -z "$(find .external_modules -name .git)" ] && echo "no .git in any clone"
      - name: Checkov Scan (tf-plan's bytes)
        id: checkov
        working-directory: canary/stack
        run: bash /tmp/checkov.sh
      - name: The step's outcome
        run: echo "checkov outcome ${{ steps.checkov.outcome }}"

  # CONTROL: the old step (v12.1347.0, no download) on the same stack.
  stack-arm-old:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkov Scan (old)
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: canary/stack
          framework: terraform
          soft_fail: true
          output_format: cli
